  <!-- Concentric embossed rings -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#14213D" stroke-width="0.75" stroke-dasharray="1.5,1" opacity="0.65" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="#14213D" stroke-width="0.5" opacity="0.5" />
  <circle cx="50" cy="50" r="31" fill="#FEFDF8" stroke="#B87518" stroke-width="1.2" />

  <!-- Shield / Notary monogram in center -->
  <path
    d="M50 26 L63 32 V48 C63 58 50 67 50 67 C50 67 37 58 37 48 V32 Z"
    fill="#2FA36B"
    stroke="#1E734A"
    stroke-width="1"
  />
  
  <!-- Checkmark -->
  <path
    d="M44 46 L48 51 L56 41"
